[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invisible-chromium"
dynamic = ["version"]
description = "Stealth Linux Desktop Chromium controller over native CDP pipe with seed-deterministic human motion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "invisible-core>=159.49.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
invisible-chromium = "invisible_chromium.cli:main"

[tool.hatch.version]
path = "src/invisible_chromium/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/invisible_chromium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: launches a real patched Chromium instance",
]
